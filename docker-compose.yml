
services:
  # ==========================================
  # MySQL Database
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: modua_mysql
    restart: always
    init: true
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: modua_aac
      MYSQL_USER: modua_user
      MYSQL_PASSWORD: modua_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - modua_network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ==========================================
  # Redis (토큰 블랙리스트, 캐싱)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: modua_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - modua_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  # ==========================================
  # FastAPI AI Server (Python)
  # ==========================================
  fastapi:
    build:
      context: ./fastapi-server
      dockerfile: Dockerfile
    container_name: modua_fastapi
    restart: always
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGINS: http://localhost:3000
      REDIS_HOST: redis       
      REDIS_PORT: 6379        
      REDIS_DB: 0             
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi-server:/app
    networks:
      - modua_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ==========================================
  # Backend API (Node.js + Express + Prisma)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modua_backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://modua_user:modua_password@mysql:3306/modua_aac
      REDIS_URL: redis://redis:6379
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      FASTAPI_URL: http://fastapi:8000
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 14d
      NODE_ENV: development
      PORT: 3000
      NLP_SERVICE_URL: http://nlp-service:8000
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-service:
        condition: service_started
      fastapi:
        condition: service_started
    networks:
      - modua_network
    command: npm run dev

  # ==========================================
  # NLP Microservice (Python + FastAPI + KoNLPy)
  # ==========================================
  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: modua_nlp
    restart: always
    ports:
      - "8000:8000"
    networks:
      - modua_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      timeout: 5s
      retries: 5


volumes:
  mysql_data:
  redis_data:

networks:
  modua_network:
    driver: bridge